name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git

      - name: Build & install FTXUI to local prefix
        run: |
          git clone https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/ftxui-install
          make -j$(nproc)
          make install
          cd ../..

      - name: Build your project
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH=$HOME/ftxui-install \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./ftxui_app test